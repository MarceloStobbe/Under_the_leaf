{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 600px;">
    <div class="card p-4 shadow-sm"
        style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3);">
        <h3 class="text-white mb-3 text-center">
            {% if comment %}Edit Comment{% else %}Edit Post{% endif %}
        </h3>

        <form method="POST">
            {% if form %}
                {{ form.hidden_tag() }}
                <div class="mb-3">
                    {{ form.content(class="form-control", rows="4") }}
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('forum') }}" class="btn btn-secondary">Cancel</a>
                    {{ form.submit(class="btn btn-success fw-bold") }}
                </div>
            {% else %}

                <div class="mb-3">
                    <textarea class="form-control" name="content" rows="4" required>{{ comment.content }}</textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('forum') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success fw-bold">Save Changes</button>
                </div>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
